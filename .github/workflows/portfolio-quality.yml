name: Portfolio Quality
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - edited
    - ready_for_review
  push:
    branches:
    - main
permissions:
  contents: read
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
      with:
        global-json-file: global.json
    - run: dotnet restore FunHabitTracker.sln
    - run: dotnet build FunHabitTracker.sln -c Release --no-restore
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
      with:
        global-json-file: global.json
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
    - run: dotnet restore FunHabitTracker.sln
    - run: dotnet test FunHabitTracker.sln -c Release --no-restore
    - run: node --test tests/js/site.test.cjs
    - run: python3 -m unittest discover -s tests/quality -v
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
      with:
        global-json-file: global.json
    - run: dotnet restore FunHabitTracker.sln
    - run: dotnet format FunHabitTracker.sln --verify-no-changes --no-restore
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
      with:
        global-json-file: global.json
    - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
      with:
        languages: csharp
        build-mode: manual
    - run: dotnet build FunHabitTracker.sln -c Release
    - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
    permissions:
      contents: read
      security-events: write
      actions: read
  dependency_scan:
    name: dependency_scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
      with:
        global-json-file: global.json
    - run: dotnet restore FunHabitTracker.sln
    - run: |
        dotnet list FunHabitTracker.sln package --vulnerable --include-transitive --format json --no-restore > dependency-audit.json
        python3 scripts/check_dependency_audit.py dependency-audit.json
  secret_scan:
    name: secret_scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Scan history with pinned Gitleaks CLI
      run: |
        mkdir -p "$RUNNER_TEMP/gitleaks"
        curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks/archive.tar.gz"
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks/archive.tar.gz" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/gitleaks/archive.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
        "$RUNNER_TEMP/gitleaks/gitleaks" git --no-banner --redact --exit-code 1 .
  traceability:
    name: traceability
    runs-on: ubuntu-latest
    steps:
    - name: Validate issue linkage
      shell: pwsh
      run: |
        if ($env:GITHUB_EVENT_NAME -ne "pull_request") { exit 0 }
        $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
        $body = [string]$event.pull_request.body
        if ($body -match 'portfolio-factory:execution-id') {
          if ($body -notmatch '<!-- portfolio-factory:execution-id=pfe-[a-f0-9]{16} -->') { throw "Invalid execution marker." }
          if ($body -notmatch '(?m)^- Source issue: https://github\.com/Robert-Programme/FunHabitTracker/issues/[0-9]+$') { throw "Missing managed source issue." }
        } elseif ($body -notmatch '(?im)\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#[0-9]+\b') {
          throw "Link the pull request with Closes/Fixes/Resolves #issue."
        }
